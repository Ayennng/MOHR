# Render Blueprint: https://render.com/docs/blueprint-spec
#
# Only the frontend is public. The backend is a private service the frontend reaches
# over Render's private network, and the database accepts private connections only.
# Private services, persistent disks and pre-deploy commands need paid plans.

envVarGroups:
  - name: mohr-shared
    envVars:
      # Both apps must share this: the backend decodes the frontend's session cookie
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "22"

services:
  - type: web
    name: mohr-frontend
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: BACKEND_URL
        fromService:
          type: pserv
          name: mohr-backend
          property: hostport
      # The public https:// URL. Override this after adding a custom domain.
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: mohr-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - fromGroup: mohr-shared

  - type: pserv
    name: mohr-backend
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    # Avatars and leave attachments. A service with a disk runs as a single instance.
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mohr-db
          property: connectionString
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - fromGroup: mohr-shared

databases:
  - name: mohr-db
    databaseName: mohr
    user: mohr
    region: singapore
    plan: 0.1c-256mb
    diskSizeGB: 5
    ipAllowList: [] # Private network only
