# Render Blueprint: https://render.com/docs/blueprint-spec
#
# Both apps run on Render's free plan. The database is external (e.g. Neon's free
# Postgres, which doesn't expire like Render's free one); uploads are stored in it.
# Free services sleep after 15 minutes without traffic and take about a minute to wake.
# An uptime pinger on the frontend's /api/health keeps both awake in working hours
# (see README); pinging around the clock would exceed the 750 free hours a month.

envVarGroups:
  - name: mohr-shared
    envVars:
      # Both apps must share this: the backend decodes the frontend's session cookie
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "22"

services:
  - type: web
    name: mohr-hr
    runtime: node
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: mohr-backend
          envVarKey: RENDER_EXTERNAL_URL
      # The public https:// URL. Override this after adding a custom domain.
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: mohr-hr
          envVarKey: RENDER_EXTERNAL_URL
      # Shows the one-click demo logins on the login page. Only for a demo database:
      # .github/workflows/reset-demo.yml wipes and reseeds it nightly (see README)
      - key: DEMO_MODE
        value: "true"
      - fromGroup: mohr-shared

  # Public because free services can't receive private-network traffic; every
  # route still requires a valid session.
  - type: web
    name: mohr-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    # Free services have no pre-deploy step, so migrations run in the build
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npx next start -p $PORT
    healthCheckPath: /api/health
    envVars:
      # Paste the database's direct (non-pooled) connection string when prompted
      - key: DATABASE_URL
        sync: false
      - fromGroup: mohr-shared
